<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un pensamiento</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #d4d4d4;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .container {
            display: none;
            max-width: 600px;
            padding: 20px;
            animation: fadeIn 3s ease-in;
        }
        p {
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }
        .enter-btn {
            padding: 12px 24px;
            border: 1px solid #444;
            background: transparent;
            color: #aaa;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.5s ease;
            letter-spacing: 1px;
        }
        .enter-btn:hover {
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        @keyframes fadeIn {
            from { opacity: 0; filter: blur(5px); }
            to { opacity: 1; filter: blur(0); }
        }
    </style>
</head>
<body>

    <button class="enter-btn" id="startBtn">Leer...</button>

    <div class="container" id="content">
        <p>
            holaaa, escribo esto como una invitacion formal<br>
            para preguntarle si...<br>
        </p>
        <p>
            jugamos? xd<br>
    </div>

    <!-- El audio apunta exactamente al nombre del archivo que me pasaste -->
    <audio id="bgMusic" src="cancion1" loop></audio> 

    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            this.style.display = 'none';
            document.getElementById('content').style.display = 'block';
            
            // Reproducir el audio al hacer clic
            const audio = document.getElementById('bgMusic');
            audio.play().catch(error => {
                console.error("Error al reproducir el audio:", error);
            });
        });
    </script>
</body>
</html>
